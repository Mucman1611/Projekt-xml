<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FanScout | Praćenje muzičkih zajednica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="container">
        <h1>🎧 FanScout</h1>
        <div class="subhead">Pretraživanje muzičkih zajednica i fandomova · Reddit · X (Twitter) · Facebook · Discord · TikTok</div>
        <div style="margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap;">
            <span class="badge">#kpop fandom</span>
            <span class="badge">#metalcommunity</span>
            <span class="badge">#indieheads</span>
            <span class="badge">#hiphopheads</span>
        </div>
    </div>
</header>

<main>
    <div class="container" id="pretraga">
        <div class="section">
            <h2 class="section-title">🔎 Pretraži muzičke zajednice</h2>
            <div class="search-zone">
                <div class="search-box">
                    <div class="input-group">
                        <label>🎤 Ime izvođača / žanr / zajednica</label>
                        <input type="text" id="searchQuery" placeholder="npr. Taylor Swift, metalcore, BTS, jazz, indie ...">
                    </div>
                    <div class="input-group">
                        <label>📱 Platforma</label>
                        <select id="platformSelect">
                            <option value="sve">Sve platforme</option>
                            <option value="Reddit">Reddit</option>
                            <option value="X (Twitter)">X (Twitter)</option>
                            <option value="Facebook">Facebook</option>
                            <option value="Discord">Discord</option>
                            <option value="TikTok">TikTok</option>
                        </select>
                    </div>
                    <button class="search-btn" onclick="pretraziZajednice()">Pretraži</button>
                </div>
                <div id="searchResults" class="results-area">
                    <div class="mock-result">✨ Unesite pojam i odaberite platformu za prikaz linkova na relevantne rasprave i stranice.</div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
